<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111827" />
<title>仕事アプリ Version 2.0</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--brand:#111827;--accent:#2563eb;--good:#059669;--warn:#d97706;--danger:#dc2626;--r:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}button,input,textarea,select{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}.top{position:sticky;top:0;z-index:20;background:rgba(243,244,246,.92);backdrop-filter:blur(14px);padding:14px 16px 10px;border-bottom:1px solid rgba(229,231,235,.8)}.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{font-size:21px;margin:0}.brand small{display:block;color:var(--muted);font-weight:500;margin-top:2px}.iconbtn{border:0;background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 1px 3px #0001}.screen{display:none;padding:14px 14px 24px}.screen.active{display:block}.hero{background:linear-gradient(135deg,#111827,#374151);color:#fff;border-radius:24px;padding:18px;margin-bottom:14px}.hero h2{margin:0 0 6px;font-size:20px}.hero p{margin:0;color:#d1d5db;font-size:14px}.prompt{margin-top:14px;background:#ffffff18;border:1px solid #ffffff22;padding:12px;border-radius:15px}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700}.btn.primary{background:var(--accent);color:white}.btn.ghost{background:#eef2ff;color:#1d4ed8}.btn.dark{background:#111827;color:white}.btn.danger{background:#fee2e2;color:#b91c1c}.btn.small{padding:8px 10px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:0 1px 2px #00000008}.card h3{margin:0 0 7px;font-size:15px}.metric{font-size:25px;font-weight:800}.muted{color:var(--muted);font-size:13px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 9px}.section-title h2{font-size:17px;margin:0}.list{display:grid;gap:9px}.row{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.row-main{min-width:0}.row-title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-sub{font-size:12px;color:var(--muted);margin-top:4px}.pill{font-size:11px;border-radius:999px;padding:5px 8px;background:#eef2ff;color:#3730a3;white-space:nowrap}.pill.good{background:#d1fae5;color:#065f46}.pill.warn{background:#fef3c7;color:#92400e}.pill.danger{background:#fee2e2;color:#991b1b}.empty{text-align:center;color:var(--muted);padding:28px 10px}.fab{position:fixed;right:max(18px,calc((100vw - 760px)/2 + 18px));bottom:88px;width:58px;height:58px;border:0;border-radius:20px;background:var(--accent);color:#fff;font-size:28px;box-shadow:0 10px 24px #2563eb55;z-index:30}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40}.nav button{border:0;background:none;color:#6b7280;font-size:11px;padding:5px}.nav button b{display:block;font-size:20px;margin-bottom:2px}.nav button.active{color:#111827;font-weight:800}.modal{position:fixed;inset:0;background:#0007;z-index:100;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet h2{margin:0}.close{border:0;background:#f3f4f6;border-radius:999px;width:36px;height:36px}.field{margin-top:13px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d1d5db;border-radius:13px;padding:12px;background:#fff}.field textarea{min-height:90px;resize:vertical}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.seg button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px}.seg button.sel{background:#111827;color:#fff}.timeline{border-left:2px solid #d1d5db;margin-left:8px;padding-left:16px}.timeitem{position:relative;margin:0 0 14px}.timeitem:before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;background:#2563eb;border-radius:50%;box-shadow:0 0 0 4px #dbeafe}.notice{padding:12px;border-radius:14px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:13px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:12px}.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.hide{display:none!important}@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div><h1 id="pageTitle">ホーム</h1><small>考えなくても、仕事が進む。</small></div><button class="iconbtn" id="backupBtn">保存</button></div></header>

<main>
<section id="home" class="screen active">
  <div class="hero"><h2 id="greeting">おはようございます</h2><p>今日も仕事を一つずつ進めましょう。</p><div class="prompt"><b>AIからの提案</b><div id="aiPrompt" style="margin-top:6px">案件を登録すると、見積・予定・日報・請求まで自動でつながります。</div><div class="actions" id="aiActions"><button class="btn primary small" onclick="openCreate('project')">案件を作る</button></div></div></div>
  <div class="grid">
    <div class="card"><h3>今日の予定</h3><div class="metric" id="todayCount">0</div><div class="muted">件</div></div>
    <div class="card"><h3>進行中案件</h3><div class="metric" id="activeCount">0</div><div class="muted">件</div></div>
    <div class="card"><h3>今月売上</h3><div class="metric" id="monthSales">¥0</div><div class="muted">入金済み</div></div>
    <div class="card"><h3>未入金</h3><div class="metric" id="unpaidTotal">¥0</div><div class="muted">要確認</div></div>
  </div>
  <div class="section-title"><h2>今日やること</h2><button class="btn ghost small" onclick="openCreate('schedule')">＋予定</button></div><div id="todayList" class="list"></div>
  <div class="section-title"><h2>最近の案件</h2><button class="btn ghost small" onclick="go('projects')">すべて</button></div><div id="recentProjects" class="list"></div>
</section>

<section id="projects" class="screen"><input class="search" placeholder="案件名・顧客名で検索" oninput="renderProjects(this.value)"><div class="section-title"><h2>案件一覧</h2><button class="btn primary small" onclick="openCreate('project')">新規案件</button></div><div id="projectList" class="list"></div></section>
<section id="docs" class="screen"><div class="chips"><button class="chip" onclick="setDocFilter('all')">すべて</button><button class="chip" onclick="setDocFilter('estimate')">見積書</button><button class="chip" onclick="setDocFilter('invoice')">請求書</button><button class="chip" onclick="setDocFilter('receipt')">領収書</button></div><div class="section-title"><h2>書類</h2><button class="btn primary small" onclick="openCreate('doc')">新規作成</button></div><div id="docList" class="list"></div></section>
<section id="daily" class="screen"><div class="section-title"><h2>日報</h2><button class="btn primary small" onclick="openCreate('daily')">今日の日報</button></div><div id="dailyList" class="list"></div></section>
<section id="more" class="screen"><div class="grid"><div class="card" onclick="showMorePanel('schedule')"><h3>📅 予定帳</h3><div class="muted">リマインダー管理</div></div><div class="card" onclick="showMorePanel('customers')"><h3>👥 顧客</h3><div class="muted">取引先と履歴</div></div><div class="card" onclick="showMorePanel('sales')"><h3>📊 売上</h3><div class="muted">入金・未入金</div></div><div class="card" onclick="showMorePanel('settings')"><h3>⚙️ 設定</h3><div class="muted">会社情報・データ</div></div></div><div id="morePanel" style="margin-top:14px"></div></section>
</main>
<button class="fab" onclick="openQuick()">＋</button>
<nav class="nav"><button class="active" data-screen="home" onclick="go('home')"><b>⌂</b>ホーム</button><button data-screen="projects" onclick="go('projects')"><b>▣</b>案件</button><button data-screen="docs" onclick="go('docs')"><b>▤</b>書類</button><button data-screen="daily" onclick="go('daily')"><b>✎</b>日報</button><button data-screen="more" onclick="go('more')"><b>•••</b>その他</button></nav>
</div>

<div id="modal" class="modal"><div class="sheet"><div class="sheet-head"><h2 id="modalTitle">新規作成</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const KEY='workos_v2_data';
const seed={projects:[],customers:[],docs:[],daily:[],schedule:[],settings:{company:'',owner:''}};
let data=load(),docFilter='all';
function load(){try{return {...seed,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));renderAll()}
function yen(n){return new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Number(n||0))}
function today(){return new Date().toISOString().slice(0,10)}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function go(name){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===name));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.screen===name));document.getElementById('pageTitle').textContent={home:'ホーム',projects:'案件',docs:'書類',daily:'日報',more:'その他'}[name];window.scrollTo({top:0,behavior:'smooth'});renderAll()}
function openModal(title,html){modalTitle.textContent=title;modalBody.innerHTML=html;modal.classList.add('show')}
function closeModal(){modal.classList.remove('show')}
function openQuick(){openModal('何を作りますか？',`<div class="grid" style="margin-top:14px"><button class="card" onclick="openCreate('project')"><h3>📂 案件</h3></button><button class="card" onclick="openCreate('doc')"><h3>📄 書類</h3></button><button class="card" onclick="openCreate('daily')"><h3>📝 日報</h3></button><button class="card" onclick="openCreate('schedule')"><h3>📅 予定</h3></button></div>`)}
function projectOptions(sel=''){return `<option value="">案件なし</option>`+data.projects.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('')}
function openCreate(type,projectId=''){
 if(type==='project')openModal('新しい案件',`<form onsubmit="createProject(event)"><div class="field"><label>案件名</label><input name="name" required placeholder="例：○○邸 外構工事"></div><div class="field"><label>顧客名</label><input name="customer" required placeholder="会社名・個人名"></div><div class="field"><label>開始日</label><input type="date" name="start" value="${today()}"></div><div class="field"><label>メモ</label><textarea name="memo"></textarea></div><div class="actions"><button class="btn primary" type="submit">案件を作成</button></div></form>`);
 if(type==='doc')openModal('書類を作成',`<form onsubmit="createDoc(event)"><div class="field"><label>書類種別</label><select name="type"><option value="estimate">見積書</option><option value="invoice">請求書</option><option value="receipt">領収書</option></select></div><div class="field"><label>案件</label><select name="projectId">${projectOptions(projectId)}</select></div><div class="field"><label>宛名</label><input name="client" required></div><div class="field"><label>件名</label><input name="title" required></div><div class="field"><label>金額</label><input name="amount" type="number" min="0" required></div><div class="field"><label>発行日</label><input name="date" type="date" value="${today()}"></div><div class="actions"><button class="btn primary">保存する</button></div></form>`);
 if(type==='daily')openModal('日報を作成',`<form onsubmit="createDaily(event)"><div class="field"><label>案件</label><select name="projectId">${projectOptions(projectId)}</select></div><div class="field"><label>日付</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>作業内容</label><textarea name="work" required placeholder="今日行った作業"></textarea></div><div class="field"><label>人員</label><input name="people" type="number" min="1" value="1"></div><div class="field"><label>気づき・申し送り</label><textarea name="note"></textarea></div><div class="actions"><button class="btn primary">日報を保存</button></div></form>`);
 if(type==='schedule')openModal('予定を追加',`<form onsubmit="createSchedule(event)"><div class="field"><label>予定名</label><input name="title" required></div><div class="field"><label>案件</label><select name="projectId">${projectOptions(projectId)}</select></div><div class="field"><label>日時</label><input name="datetime" type="datetime-local" required></div><div class="field"><label>通知</label><select name="remind"><option value="0">時刻になったら</option><option value="30">30分前</option><option value="60">1時間前</option><option value="1440">1日前</option></select></div><div class="actions"><button class="btn primary">予定に追加</button></div></form>`)
}
function createProject(e){e.preventDefault();let f=new FormData(e.target),c=f.get('customer').trim();let customer=data.customers.find(x=>x.name===c);if(!customer){customer={id:id(),name:c,phone:'',email:''};data.customers.push(customer)}let p={id:id(),name:f.get('name'),customerId:customer.id,start:f.get('start'),status:'active',memo:f.get('memo'),created:Date.now()};data.projects.unshift(p);save();closeModal();askAfter('案件を作成しました','この案件の見積書を作成しますか？',()=>openCreate('doc',p.id))}
function createDoc(e){e.preventDefault();let f=new FormData(e.target),d={id:id(),type:f.get('type'),projectId:f.get('projectId'),client:f.get('client'),title:f.get('title'),amount:Number(f.get('amount')),date:f.get('date'),paid:f.get('type')==='receipt',created:Date.now()};data.docs.unshift(d);save();closeModal();if(d.type==='estimate')askAfter('見積書を保存しました','提出予定を予定帳へ登録しますか？',()=>openCreate('schedule',d.projectId));if(d.type==='invoice')askAfter('請求書を保存しました','入金予定日のリマインダーを登録しますか？',()=>openCreate('schedule',d.projectId))}
function createDaily(e){e.preventDefault();let f=new FormData(e.target);data.daily.unshift({id:id(),projectId:f.get('projectId'),date:f.get('date'),work:f.get('work'),people:Number(f.get('people')),note:f.get('note'),created:Date.now()});save();closeModal();askAfter('日報を保存しました','この案件の次の予定を登録しますか？',()=>openCreate('schedule',f.get('projectId')))}
function createSchedule(e){e.preventDefault();let f=new FormData(e.target);data.schedule.unshift({id:id(),title:f.get('title'),projectId:f.get('projectId'),datetime:f.get('datetime'),remind:Number(f.get('remind')),done:false,created:Date.now()});save();closeModal()}
function askAfter(title,q,yes){openModal(title,`<div class="notice" style="margin-top:14px">${q}</div><div class="actions"><button class="btn primary" id="yesNext">はい</button><button class="btn ghost" onclick="closeModal()">あとで</button></div>`);yesNext.onclick=yes}
function projectName(pid){return data.projects.find(p=>p.id===pid)?.name||'案件なし'}
function customerName(cid){return data.customers.find(c=>c.id===cid)?.name||''}
function renderAll(){renderHome();renderProjects();renderDocs();renderDaily();if(document.getElementById('more').classList.contains('active'))showMorePanel('schedule')}
function renderHome(){let t=today();let todays=data.schedule.filter(s=>s.datetime?.slice(0,10)===t&&!s.done);todayCount.textContent=todays.length;activeCount.textContent=data.projects.filter(p=>p.status==='active').length;let now=new Date(),sales=data.docs.filter(d=>d.type!=='estimate'&&d.paid&&new Date(d.date).getMonth()===now.getMonth()&&new Date(d.date).getFullYear()===now.getFullYear()).reduce((a,b)=>a+b.amount,0);monthSales.textContent=yen(sales);let unpaid=data.docs.filter(d=>d.type==='invoice'&&!d.paid).reduce((a,b)=>a+b.amount,0);unpaidTotal.textContent=yen(unpaid);todayList.innerHTML=todays.length?todays.map(s=>rowHtml(s.title,new Date(s.datetime).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'・'+projectName(s.projectId),`<button class="btn ghost small" onclick="doneSchedule('${s.id}')">完了</button>`)).join(''):'<div class="empty">今日の予定はありません</div>';recentProjects.innerHTML=data.projects.slice(0,3).map(p=>rowHtml(p.name,customerName(p.customerId)+'・'+(p.start||''),'<span class="pill good">進行中</span>',`openProject('${p.id}')`)).join('')||'<div class="empty">最初の案件を作成しましょう</div>';let msg='案件を登録すると、見積・予定・日報・請求まで自動でつながります。',act=`<button class="btn primary small" onclick="openCreate('project')">案件を作る</button>`;let unpaidDoc=data.docs.find(d=>d.type==='invoice'&&!d.paid);if(unpaidDoc){msg=`${esc(unpaidDoc.client)}の請求 ${yen(unpaidDoc.amount)} が未入金です。`;act=`<button class="btn primary small" onclick="markPaid('${unpaidDoc.id}')">入金済みにする</button>`}else if(data.projects.length&&!data.daily.find(d=>d.date===t)){msg='今日の日報がまだ作成されていません。';act=`<button class="btn primary small" onclick="openCreate('daily')">日報を作る</button>`}aiPrompt.innerHTML=msg;aiActions.innerHTML=act}
function rowHtml(title,sub,right='',click=''){return `<div class="row" ${click?`onclick="${click}"`:''}><div class="row-main"><div class="row-title">${esc(title)}</div><div class="row-sub">${esc(sub)}</div></div>${right}</div>`}
function renderProjects(q=''){let list=data.projects.filter(p=>(p.name+' '+customerName(p.customerId)).toLowerCase().includes(q.toLowerCase()));projectList.innerHTML=list.map(p=>rowHtml(p.name,customerName(p.customerId)+'・開始 '+(p.start||'未定'),'<span class="pill good">進行中</span>',`openProject('${p.id}')`)).join('')||'<div class="empty">案件がありません</div>'}
function openProject(pid){let p=data.projects.find(x=>x.id===pid);if(!p)return;let docs=data.docs.filter(d=>d.projectId===pid),daily=data.daily.filter(d=>d.projectId===pid),sched=data.schedule.filter(s=>s.projectId===pid);openModal(p.name,`<div class="muted" style="margin-top:6px">${esc(customerName(p.customerId))}</div><div class="actions"><button class="btn ghost small" onclick="openCreate('doc','${pid}')">書類</button><button class="btn ghost small" onclick="openCreate('daily','${pid}')">日報</button><button class="btn ghost small" onclick="openCreate('schedule','${pid}')">予定</button></div><div class="section-title"><h2>案件タイムライン</h2></div><div class="timeline">${[...docs.map(x=>({date:x.date,text:{estimate:'見積書',invoice:'請求書',receipt:'領収書'}[x.type]+' '+yen(x.amount)})),...daily.map(x=>({date:x.date,text:'日報：'+x.work.slice(0,30)})),...sched.map(x=>({date:x.datetime?.slice(0,10),text:'予定：'+x.title}))].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<div class="timeitem"><b>${esc(x.text)}</b><div class="muted">${esc(x.date||'')}</div></div>`).join('')||'<div class="empty">履歴はまだありません</div>'}</div>`)}
function setDocFilter(f){docFilter=f;renderDocs()}
function renderDocs(){let l=data.docs.filter(d=>docFilter==='all'||d.type===docFilter);docList.innerHTML=l.map(d=>rowHtml(({estimate:'見積書',invoice:'請求書',receipt:'領収書'}[d.type])+'｜'+d.title,d.client+'・'+d.date,`<span class="pill ${d.paid?'good':d.type==='invoice'?'warn':''}">${yen(d.amount)}</span>`,d.type==='invoice'&&!d.paid?`markPaid('${d.id}')`:'' )).join('')||'<div class="empty">書類がありません</div>'}
function renderDaily(){dailyList.innerHTML=data.daily.map(d=>rowHtml(d.date+'｜'+projectName(d.projectId),d.work,`<span class="pill">${d.people}人</span>`)).join('')||'<div class="empty">日報がありません</div>'}
function doneSchedule(sid){let s=data.schedule.find(x=>x.id===sid);if(s)s.done=true;save()}
function markPaid(did){let d=data.docs.find(x=>x.id===did);if(d){d.paid=true;save();closeModal()}}
function showMorePanel(type){if(type==='schedule'){morePanel.innerHTML=`<div class="section-title"><h2>予定帳</h2><button class="btn primary small" onclick="openCreate('schedule')">追加</button></div><div class="list">${data.schedule.map(s=>rowHtml(s.title,new Date(s.datetime).toLocaleString('ja-JP')+'・'+projectName(s.projectId),s.done?'<span class="pill good">完了</span>':'<span class="pill warn">予定</span>')).join('')||'<div class="empty">予定がありません</div>'}</div>`}if(type==='customers'){morePanel.innerHTML=`<div class="section-title"><h2>顧客</h2></div><div class="list">${data.customers.map(c=>rowHtml(c.name,data.projects.filter(p=>p.customerId===c.id).length+'案件')).join('')||'<div class="empty">顧客がありません</div>'}</div>`}if(type==='sales'){let inv=data.docs.filter(d=>d.type==='invoice');morePanel.innerHTML=`<div class="section-title"><h2>売上・入金</h2></div><div class="grid"><div class="card"><h3>請求総額</h3><div class="metric">${yen(inv.reduce((a,b)=>a+b.amount,0))}</div></div><div class="card"><h3>未入金</h3><div class="metric">${yen(inv.filter(x=>!x.paid).reduce((a,b)=>a+b.amount,0))}</div></div></div>`}if(type==='settings'){morePanel.innerHTML=`<div class="section-title"><h2>設定</h2></div><div class="card"><div class="field"><label>会社名</label><input id="companyInput" value="${esc(data.settings.company||'')}"></div><div class="field"><label>代表者名</label><input id="ownerInput" value="${esc(data.settings.owner||'')}"></div><div class="actions"><button class="btn primary" onclick="saveSettings()">保存</button><button class="btn danger" onclick="resetData()">全データ削除</button></div></div>`}}
function saveSettings(){data.settings.company=companyInput.value;data.settings.owner=ownerInput.value;save()}
function resetData(){if(confirm('すべてのデータを削除しますか？')){data=structuredClone(seed);save()}}
backupBtn.onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='workos-backup.json';a.click();URL.revokeObjectURL(a.href)};
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
const h=new Date().getHours();greeting.textContent=h<11?'おはようございます':h<18?'こんにちは':'お疲れさまです';renderAll();
</script>
</body>
</html>
